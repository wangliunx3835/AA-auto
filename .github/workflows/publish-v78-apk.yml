name: Publish verified V78 APK
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/publish-v78-apk.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/v78-apk'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download previously tested APK
        env:
          APK_ARCHIVE_URL: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-9dd0-81f8-91a7-d34efd29e801/raw?se=2026-11-07T08%3A33%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=082822b0-b45e-4913-932c-337d2c06709d&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T00%3A39%3A34Z&ske=2026-11-08T00%3A39%3A34Z&sks=b&skv=2026-02-06&sig=/yOJtYBU7fsnleb5xnKGureOaWN1vYzOkmf9YDxUugA%3D'
        run: |
          curl -fsSL "$APK_ARCHIVE_URL" -o artifact.zip
          unzip -q artifact.zip -d artifact
          cp artifact/AADisplay-dual-v78-new-signature.apk .
          echo '00396175e5182d0194fae0faafb1b7e63c3d77e3d7597cb81f84c5728e552434  AADisplay-dual-v78-new-signature.apk' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish APK only
        run: |
          cat > release-notes.md <<'EOF'
          用户已实车确认 V78 修复 Android Auto 连接问题。
          修复：新配对车机列表、蓝牙 SDP 结果刷新，以及手动选择被旧刷新任务干扰。
          保留不闪屏修复和原有 CarPlay 实现。
          APK 为已经交付并测试的同一文件，未重新编译或更换签名。大小 19,435,607 字节（18.54 MiB）。
          自动化测试 141 项通过，1 项外部真实证书测试跳过。
          
          安装：V77 及更早版本需要备份设置和私人证书、卸载旧版后安装，并重新启用 LSPosed 模块、重启一次。已经安装此次 V78 新签名版的用户无需重装。
          源码单独发布在私有仓库 wangliunx3835/AA-auto-source 的 v78-source Release。
          签名 SHA-256：fb47aa1efd4809fcdf1c280c9904e779756212b97d36442b2663234869e20a43。
          EOF
          gh release create v78 AADisplay-dual-v78-new-signature.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'V78 · Android Auto 连接修复' --notes-file release-notes.md
          gh release view v78 --repo "$GITHUB_REPOSITORY" --json url,assets
